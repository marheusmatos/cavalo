<div class="modal-overlay" id="reset-modal" onclick="hideReset(event)">
<div class="modal" style="max-width:480px">
  <div class="modal-title">🔄 Reset do sistema<button class="modal-close" onclick="closeReset()">✕</button></div>
  <div class="alert a-err" style="margin-bottom:20px">
    ⚠️ <strong>Atenção:</strong> as ações abaixo são irreversíveis. Selecione apenas o que deseja apagar.
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px">
    <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;transition:border-color .15s" id="reset-row-enviar">
      <input type="checkbox" id="reset-enviar" checked style="margin-top:2px;accent-color:var(--orange);width:16px;height:16px;flex-shrink:0">
      <div>
        <div style="font-weight:600;font-size:13px">Fila de envio <span style="font-family:monospace;font-size:11px;color:var(--text3)">enviar/</span></div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Arquivos aguardando consolidação e envio</div>
      </div>
    </label>
    <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;transition:border-color .15s" id="reset-row-consolidado">
      <input type="checkbox" id="reset-consolidado" checked style="margin-top:2px;accent-color:var(--orange);width:16px;height:16px;flex-shrink:0">
      <div>
        <div style="font-weight:600;font-size:13px">Consolidados <span style="font-family:monospace;font-size:11px;color:var(--text3)">consolidado/</span></div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Arquivos base_consolidada gerados</div>
      </div>
    </label>
    <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;transition:border-color .15s" id="reset-row-enviado">
      <input type="checkbox" id="reset-enviado" style="margin-top:2px;accent-color:var(--orange);width:16px;height:16px;flex-shrink:0">
      <div>
        <div style="font-weight:600;font-size:13px">Arquivos enviados <span style="font-family:monospace;font-size:11px;color:var(--text3)">enviado/</span></div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Histórico de arquivos já disparados</div>
      </div>
    </label>
    <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;transition:border-color .15s" id="reset-row-log">
      <input type="checkbox" id="reset-log" style="margin-top:2px;accent-color:var(--orange);width:16px;height:16px;flex-shrink:0">
      <div>
        <div style="font-weight:600;font-size:13px">Log de envios <span style="font-family:monospace;font-size:11px;color:var(--text3)">log_envio.csv</span></div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Histórico completo de todos os envios realizados</div>
      </div>
    </label>
  </div>
  <div id="reset-res" style="margin-bottom:12px"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn btn-ghost" onclick="closeReset()">Cancelar</button>
    <button class="btn" id="btn-reset-exec" style="background:#b91c1c;color:white" onclick="execReset()">🔄 Executar Reset</button>
  </div>
</div>
</div>
