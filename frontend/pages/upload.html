<!-- Seção: Upload (só o conteúdo; o template é o index.html) -->
<style>
  .drop-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .upload-icon-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--cor-circulo);
    animation: circle-in 5s ease-out forwards;
    animation-iteration-count: infinite;
  }

  @keyframes circle-in {
    0%   { transform: scale(0); opacity: 1; }
    50%  { transform: scale(0); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  .upload-icon {
    position: relative;
    z-index: 1;
    font-size: 200px;
    color: var(--cor-primaria);
  }
</style>

<div id="drop-zone" class="drop-zone">
  <div class="upload-icon-wrapper">
    <span class="material-symbols-outlined upload-icon">upload_file</span>
    <span class="circle-bg"></span>
  </div>
  <input type="file" id="file-input" hidden />
</div>
