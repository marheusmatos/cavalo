<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>v2cte</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    import '@material/web/menu/menu.js';
    import '@material/web/menu/menu-item.js';
  </script>

  <link rel="stylesheet" href="static/style.css" />
</head>
<body>

  <header class="top-bar">
    <button id="drawer-btn" class="icon-btn" aria-label="Abrir menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="top-bar-right">
      <button id="theme-btn" class="icon-btn" aria-label="Alternar tema">
        <span id="theme-icon" class="material-symbols-outlined">light_mode</span>
      </button>
      <span class="profile-anchor-wrapper">
      <button id="profile-btn" class="profile-avatar" aria-label="Menu do perfil"></button>
      <md-menu id="profile-menu" anchor="profile-btn">
        <md-menu-item><div slot="headline">Sair</div></md-menu-item>

      </md-menu>
      </span>
    </span>
  </header>

  <!-- Navigation drawer (modal, spec M3) -->
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="nav-drawer">
    <nav>
      <button class="nav-item active" data-page="upload">
        <span class="material-symbols-outlined">upload_file</span>
        <span>Upload</span>
      </button>
      <button class="nav-item" data-page="historico">
        <span class="material-symbols-outlined">history</span>
        <span>Histórico</span>
      </button>
      <button class="nav-item" data-page="configuracoes">
        <span class="material-symbols-outlined">settings</span>
        <span>Configurações</span>
      </button>
    </nav>
  </aside>

  <!-- Conteúdo da seção ativa é injetado aqui (pages/*.html) -->
  <main id="content" class="content"></main>

  <script src="static/app.js" defer></script>
</body>
</html>
