<!-- Seção: Processing (mostrada após receber um documento) -->
<style>
  .processing {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  .processing img {
    max-width: 240px;
    max-height: 240px;
  }

  /* Barra de progresso em HTML/CSS no estilo do M3 linear progress:
     trilha de 4px com cantos arredondados + indicador na cor primária.
     Progresso controlado pela largura de .progress-fill (inline style). */
  .progress-track {
    width: min(320px, 70vw);
    height: 4px;
    border-radius: 2px;
    background: var(--cor-circulo);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--cor-primaria);
    transition: width 0.05s linear; /* casa com o tick do timer (50ms) */
  }
</style>

<div class="processing">
  <div class="upload-icon-wrapper">
    <img src="imgs/shopito.png" alt="Processando documento" />
    <!-- <span class="circle-bg"></span> -->
  </div>
  <div class="progress-track">
    <div id="progress-fill" class="progress-fill" style="width: 50%"></div>
  </div>
</div>
