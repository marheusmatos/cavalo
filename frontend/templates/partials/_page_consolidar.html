<div class="page" id="page-consolidar">
  <div class="stepper">
    <div class="step done" id="step-c1"><div class="step-num">✓</div><div class="step-label">Upload</div></div>
    <div class="step-arrow">›</div>
    <div class="step active"><div class="step-num">2</div><div class="step-label">Consolidar</div></div>
    <div class="step-arrow">›</div>
    <div class="step"><div class="step-num">3</div><div class="step-label">Enviar</div></div>
  </div>
  <!-- Selecionar ops para consolidar -->
  <div class="section">
    <div class="section-title" style="justify-content:space-between">
      <span>Gerar Consolidados</span>
    </div>
    <div class="chips" id="chips-consol"></div>
    <div class="chip-actions">
      <button class="btn btn-ghost btn-sm" onclick="selAll('consol')">Todas</button>
      <button class="btn btn-ghost btn-sm" onclick="clrAll('consol')">Limpar</button>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-green" id="btn-consol-enviar" onclick="doConsolEEnviar()">📧 Consolidar e Enviar</button>
      <button class="btn btn-secondary" id="btn-consol" onclick="doConsol()">🔗 Só Consolidar</button>
      <button class="btn btn-ghost btn-sm" onclick="go('ajustes')" title="Ajuste de Imposto, Valor Zerado e FM">🔧 Ajuste Manual</button>
      <button class="btn btn-secondary btn-sm" onclick="loadConsolTabela()">🔄 Atualizar</button>
      <button class="btn btn-secondary btn-sm js-btn-sheets-consol" onclick="enviarConsolidadosSheets()"
              title="Cola na última linha das abas quebra_* / incentivo_* da planilha — pula o que já foi colado antes">📋 Colar no Sheets</button>
    </div>
    <div class="prog-bar-wrap" id="pb-consol"><div class="prog-bar run" id="pbar-consol"></div></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:2px">
      <button class="btn btn-ghost btn-sm" id="btn-clear-consol" style="font-size:11px;padding:3px 10px;display:none" onclick="clearLog('log-consol','btn-clear-consol')">✕ Limpar log</button>
    </div>
    <div class="log-box" id="log-consol"></div>
    <div id="consol-res" style="margin-top:12px"></div>
  </div>

  <!-- Visualizar consolidados existentes -->
  <div class="section" id="consol-viewer">
    <div class="section-title" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>📊 Consolidados existentes</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="consol-dl-area">
        <button class="btn btn-secondary btn-sm js-btn-sheets-consol" onclick="enviarConsolidadosSheets()"
                title="Cola na última linha das abas quebra_* / incentivo_* da planilha — pula o que já foi colado antes">📋 Colar no Sheets</button>
        <button class="btn btn-ghost btn-sm" onclick="downloadConsolFiltrado()">⬇️ Baixar selecionados</button>
        <button class="btn btn-ghost btn-sm" onclick="downloadConsolFiltrado('all')">⬇️ Baixar tudo</button>
        <button class="btn btn-ghost btn-sm" id="btn-limpar-consol" onclick="limparConsolidados()"
                style="color:var(--red);border-color:var(--red);opacity:.75">🗑️ Limpar antigos</button>
      </div>
    </div>
    <div id="consol-sheets-res" style="margin-bottom:12px"></div>

    <!-- Resumo por op -->
    <div id="consol-op-cards" style="margin-bottom:16px"></div>

    <!-- Filtros -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center" id="consol-filter-bar">
      <div class="chips" id="chips-consol-view" style="margin-bottom:0;flex:1;min-width:0"></div>
      <select class="input" id="consol-q" style="max-width:220px;padding:7px 12px;font-size:13px" onchange="renderConsolTabela()">
        <option value="">🚚 Todas as transportadoras</option>
      </select>
    </div>

    <!-- Tabela com scroll -->
    <div style="border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      <div style="overflow-x:auto">
        <table style="min-width:700px">
          <thead><tr>
            <th>Op</th>
            <th>Nome Transportadora (3PL)</th>
            <th>CNPJ Tomador</th>
            <th>Operação</th>
            <th style="text-align:right">Valor Final à Receber</th>
            <th>Período</th>
          </tr></thead>
        </table>
      </div>
      <div id="consol-tbl-scroll" style="max-height:360px;overflow-y:auto;overflow-x:auto">
        <table style="min-width:700px;width:100%">
          <tbody id="consol-tbody">
            <tr><td colspan="6" style="text-align:center;padding:28px;color:var(--text3)">
              <span class="spin"></span> Carregando...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <div id="consol-show-more" style="display:none">
        <button class="btn btn-ghost btn-sm" onclick="consolShowMore()">Ver mais linhas ↓</button>
      </div>
      <div id="consol-tbl-footer" style="font-size:12px;color:var(--text3);text-align:right;flex:1"></div>
    </div>
    <div id="consol-limpar-res" style="margin-top:10px"></div>
  </div>
</div>
