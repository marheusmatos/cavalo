<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>v2cte</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    import '@material/web/menu/menu.js';
    import '@material/web/menu/menu-item.js';
  </script>

  <link rel="stylesheet" href="static/style.css" />
</head>
<body>

  <header class="top-bar">
    <span class="profile-anchor-wrapper">
      <button id="profile-btn" class="profile-avatar" aria-label="Menu do perfil"></button>
      <md-menu id="profile-menu" anchor="profile-btn">
        <md-menu-item><div slot="headline">Opção A</div></md-menu-item>
        <md-menu-item><div slot="headline">Opção B</div></md-menu-item>
        <md-menu-item><div slot="headline">Opção C</div></md-menu-item>
      </md-menu>
    </span>
  </header>

  <!-- Página inteira é a drop zone -->
  <main id="drop-zone" class="drop-zone">
    
    <div class="upload-icon-wrapper">
      <span class="material-symbols-outlined upload-icon">upload_file</span>
      <span class="circle-bg"></span>
    </div>
    
    <input type="file" id="file-input" hidden />
  </main>

  <script src="static/app.js" defer></script>
</body>
</html>
