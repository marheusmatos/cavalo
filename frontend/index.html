<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#131316" />
  <title>ferradura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script type="importmap">{ "imports": { "@material/web/": "https://esm.run/@material/web/" } }</script>
  <script type="module">
    import '@material/web/all.js';
    import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <!-- ?v=: só para furar o cache de quem pegou a versão sem Cache-Control -->
  <link rel="stylesheet" href="static/theme.css?v=2" />
</head>
<body>
  <div class="app">
    <header class="appbar" id="appbar" hidden>
      <md-icon-button id="back" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></md-icon-button>
      <div class="appbar__title" id="title"></div>
      <span class="appbar__actions" id="actions"></span>
      <md-icon-button id="bell" class="bell" aria-label="Alertas"><span class="material-symbols-outlined">notifications</span></md-icon-button>
    </header>
    <!-- A tela ativa (static/pages/*.html) é injetada aqui pelo app.js -->
    <main class="screen" id="screen"></main>
  </div>

  <!-- Painel de alertas (drawer lateral direito) -->
  <div class="scrim" id="alertsScrim"></div>
  <aside class="drawer" id="alertsDrawer" aria-label="Alertas">
    <div class="drawer__head">
      <span class="md-typescale-title-large">Alertas</span>
      <md-icon-button id="alertsClose" aria-label="Fechar"><span class="material-symbols-outlined">close</span></md-icon-button>
    </div>
    <div class="drawer__body" id="alertsList"></div>
  </aside>

  <div id="toast" class="toast" role="status"></div>

  <script src="static/app.js?v=2" defer></script>
</body>
</html>
