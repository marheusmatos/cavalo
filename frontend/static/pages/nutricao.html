<!-- Tela: Nutrição (plano semanal por turno) -->
<section class="page page--narrow pad">
  <div class="nutri__head">
    <span class="nutri__title">Plano semanal</span>
    <span class="muted" style="font-size:12px">Toque num horário para editar</span>
  </div>

  <div class="cal-row cal-head">
    <span></span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span>
  </div>
  <div id="calendar"></div>

  <div class="legend">
    <span><i style="background:#E9A48C"></i>Manhã</span>
    <span><i style="background:#C6462F"></i>Tarde</span>
    <span><i style="background:#6E2A1E"></i>Noite</span>
  </div>
</section>

<div class="fab-wrap">
  <md-fab id="fabMeal" aria-label="Nova refeição">
    <span slot="icon" class="material-symbols-outlined">add</span>
  </md-fab>
</div>

<md-dialog id="mealDialog">
  <div slot="headline" class="meal-head">
    <span id="mealTitle">Refeição</span>
    <label class="time-chip">
      <span class="material-symbols-outlined">schedule</span>
      <input type="time" id="mealTime" required aria-label="Horário" />
    </label>
  </div>
  <form slot="content" id="mealForm" method="dialog" class="dialog-form">
    <div id="shiftBox">
      <div class="label muted" style="margin-bottom:8px">Turno</div>
      <div class="segmented" id="shiftSeg">
        <button type="button" class="seg" data-v="M">Manhã</button>
        <button type="button" class="seg" data-v="T">Tarde</button>
        <button type="button" class="seg" data-v="N">Noite</button>
      </div>
    </div>

    <div class="row">
      <span class="muted" style="font-size:13px">Composição da ração</span>
      <span id="sumChip" class="sum-chip sum-chip--ok">Soma 100%</span>
    </div>
    <div>
      <label class="label" style="display:block">Ração X</label>
      <md-slider id="sx" labeled min="0" max="100" value="40"></md-slider>
      <label class="label" style="display:block">Ração Y</label>
      <md-slider id="sy" labeled min="0" max="100" value="35"></md-slider>
      <label class="label" style="display:block">Ração Z</label>
      <md-slider id="sz" labeled min="0" max="100" value="25"></md-slider>
    </div>

    <md-outlined-text-field id="mealKg" label="Quantidade total (kg)" type="number" value="3" step="0.5" min="0.5"></md-outlined-text-field>

    <div>
      <div class="label muted" style="margin-bottom:8px">Recorrência</div>
      <div class="segmented" id="recSeg">
        <button type="button" class="seg" data-v="nunca">Nunca</button>
        <button type="button" class="seg" data-v="diario">Diariamente</button>
        <button type="button" class="seg" data-v="uteis">Dias úteis</button>
      </div>
    </div>
  </form>
  <div slot="actions">
    <md-text-button id="mealDelete" class="danger">Excluir</md-text-button>
    <md-filled-button id="mealSave">Salvar</md-filled-button>
  </div>
</md-dialog>
