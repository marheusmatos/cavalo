<div class="page active" id="page-gerar">
  <div class="stepper">
    <div class="step active" id="step-g1"><div class="step-num">1</div><div class="step-label">Gerar</div></div>
    <div class="step-arrow">›</div>
    <div class="step" id="step-g2"><div class="step-num">2</div><div class="step-label">Validar</div></div>
    <div class="step-arrow">›</div>
    <div class="step" id="step-g3"><div class="step-num">3</div><div class="step-label">Ajustar / Enviar</div></div>
  </div>

  <div class="section">
    <div class="section-title">Gerar Pré-Fatura <span class="pill">Last Mile Hub · First Mile · First Mile BIGS</span></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">
      Consulta a API Datasuite e gera o xlsx já direto na fila de <strong>enviar/</strong> — sem precisar subir o arquivo manualmente depois.
    </p>
    <div class="grid2">
      <div class="form-row">
        <label class="label">Modalidade</label>
        <select class="select" id="ger-modalidade">
          <option value="LM">Last Mile Hub</option>
          <option value="FM">First Mile</option>
          <option value="FM_BIGS">First Mile BIGS</option>
        </select>
      </div>
      <div class="form-row">
        <label class="label">Quinzena</label>
        <select class="select" id="ger-quinzena">
          <option value="01">1ª quinzena (01–15)</option>
          <option value="02">2ª quinzena (16–fim)</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="form-row">
        <label class="label">Ano</label>
        <input class="input" id="ger-ano" type="number" placeholder="2026">
      </div>
      <div class="form-row">
        <label class="label">Mês</label>
        <input class="input" id="ger-mes" type="number" min="1" max="12" placeholder="6">
      </div>
    </div>
    <div class="form-row">
      <label class="label">Dia de corte (opcional)</label>
      <input class="input" id="ger-corte" type="number" min="1" max="31" placeholder="Deixe vazio para gerar o período completo">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-ger-buscar" onclick="gerBuscar3pls()">🔎 Buscar 3PLs do período</button>
    </div>

    <div id="ger-3pl-wrap" style="display:none;margin-top:16px">
      <div class="section-title" style="justify-content:space-between">
        <span>Selecione a(s) 3PL(s)</span>
        <div class="chip-actions">
          <button class="btn btn-ghost btn-sm" onclick="gerSelAll3pl()">Todas</button>
          <button class="btn btn-ghost btn-sm" onclick="gerClrAll3pl()">Limpar</button>
        </div>
      </div>
      <div class="ger-3pl-list" id="ger-3pl-chips"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-ger-iniciar" onclick="gerIniciar()">⚙️ Gerar Pré-Fatura(s)</button>
        <button class="btn btn-ghost btn-sm" id="btn-ger-cancelar" onclick="gerCancelar()" style="display:none;color:var(--red);border-color:var(--red)">⛔ Cancelar</button>
      </div>
    </div>

    <div class="ger-prog-stats" id="ger-prog-stats">
      <span class="ger-stat ger-stat-total">📦 Total: <b id="ger-stat-total">0</b></span>
      <span class="ger-stat ger-stat-ok">✅ Baixadas: <b id="ger-stat-ok">0</b></span>
      <span class="ger-stat ger-stat-pend">⏳ Faltam: <b id="ger-stat-pend">0</b></span>
      <span class="ger-stat ger-stat-err zero" id="ger-stat-err-wrap">❌ Falharam: <b id="ger-stat-err">0</b></span>
    </div>
    <div class="prog-label" id="ger-prog-label"></div>
    <div class="prog-real" id="ger-prog-bar"><div class="prog-real-bar" id="ger-prog-bar-fill" style="width:0%"></div></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:2px">
      <button class="btn btn-ghost btn-sm" id="btn-clear-ger" style="font-size:11px;padding:3px 10px;display:none" onclick="clearLog('log-ger','btn-clear-ger')">✕ Limpar log</button>
    </div>
    <div class="log-box" id="log-ger"></div>
    <div id="ger-res" style="margin-top:14px"></div>
  </div>
</div>
