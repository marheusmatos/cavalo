<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cars API — Frontend</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🚗 Cars API</h1>
      <p>Frontend simples para a API de carros (FastAPI + fastapi-guard)</p>
    </div>
    <div id="session" class="session hidden">
      <span id="session-user"></span>
      <button id="logout-btn" class="secondary">Sair</button>
    </div>
  </header>

  <main class="container">
    <!-- ===================== TELA DE LOGIN ===================== -->
    <section id="login-view" class="card login-card">
      <h2>Entrar</h2>
      <form id="jwt-form">
        <p class="hint">
          Faz login em <code>/auth/token</code> e usa o token JWT nas chamadas.
          A doc também aceita esse token no botão <strong>Authorize</strong> em
          <a href="/docs" target="_blank">/docs</a>.
        </p>
        <label>Usuário
          <input type="text" name="username" value="admin" required />
        </label>
        <label>Senha
          <input type="password" name="password" value="admin" required />
        </label>
        <button type="submit">Entrar</button>
      </form>

      <div class="divider"><span>ou</span></div>

      <a id="google-btn" class="google-btn" href="/auth/google/login">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Entrar com Google
      </a>

      <span id="login-msg" class="msg"></span>
    </section>

    <!-- ===================== APP (após login) ===================== -->
    <div id="app-view" class="hidden">
      <section class="card">
        <h2>Cadastrar carro</h2>
        <form id="car-form">
          <div class="grid">
            <label>Marca *
              <input type="text" name="brand" required placeholder="Toyota" />
            </label>
            <label>Modelo *
              <input type="text" name="model" required placeholder="Corolla" />
            </label>
            <label>Cor
              <input type="text" name="color" placeholder="Prata" />
            </label>
            <label>Ano *
              <input type="number" name="year" required placeholder="2024" />
            </label>
            <label>Preço *
              <input type="number" name="price" step="0.01" required placeholder="120000" />
            </label>
          </div>
          <button type="submit">Adicionar</button>
          <span id="form-msg" class="msg"></span>
        </form>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Carros cadastrados</h2>
          <button id="reload-btn" class="secondary">Recarregar</button>
        </div>
        <table id="cars-table">
          <thead>
            <tr>
              <th>ID</th><th>Marca</th><th>Modelo</th>
              <th>Cor</th><th>Ano</th><th>Preço</th>
            </tr>
          </thead>
          <tbody id="cars-body">
            <tr><td colspan="6" class="empty">Carregando…</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
