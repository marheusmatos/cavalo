<div class="topbar">
  <div class="topbar-title" id="topbar-title">Gerar</div>
  <div class="topbar-right">
    <!-- Badge de carga do servidor -->
    <div id="carga-badge" style="display:none;align-items:center;gap:5px;
      padding:4px 10px;border-radius:8px;font-size:11.5px;border:1px solid;
      user-select:none;cursor:default" title="Jobs em andamento no servidor"></div>
    <div id="net-url-badge" style="display:none;align-items:center;gap:6px;
      background:var(--blueL);border:1px solid #bfdbfe;border-radius:8px;
      padding:4px 10px;font-size:11.5px;color:#1d4ed8;cursor:pointer"
      title="Clique para copiar" onclick="copyNetUrl()">
      <span>🌐</span>
      <span id="net-url-text">—</span>
      <span id="net-url-copied" style="display:none;color:var(--green)">✓</span>
    </div>
    <div id="presence-badge" title="Usuários com o sistema aberto agora"
      style="display:none;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;
             font-size:11.5px;cursor:default;border:1px solid;user-select:none">
      <span id="presence-dot" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>
      <span id="presence-txt">—</span>
    </div>
    <button class="dark-btn" id="btn-dark" onclick="toggleDark()" title="Alternar tema">🌙</button>
    <button class="btn btn-ghost btn-sm" onclick="showConfig()">⚙️ Config</button>
    <button class="btn btn-ghost btn-sm" id="btn-admin" onclick="adminOpen()" title="Acesso admin" style="padding:7px 10px">🔐</button>
    <span id="ws-badge" title="ID da sua sessão — cada aba do navegador tem a sua"
      style="font-family:var(--mono,monospace);font-size:10px;color:var(--text3);
             padding:2px 7px;background:var(--bg);border-radius:5px;
             border:1px solid var(--border);letter-spacing:.3px;cursor:default">—</span>
    <span class="clock" id="clock">--:--</span>
  </div>
</div>
