<div class="admin-banner" id="admin-banner">
  <span>🔐 Modo Admin</span>
  <span style="color:#818cf8">Visualizando workspace:</span>
  <span class="admin-ws-pill" id="admin-ws-pill" onclick="showAdminWorkspaces()">—</span>
  <span id="admin-ws-email" style="color:#a5b4fc;font-size:12px"></span>
  <button class="admin-exit" onclick="adminExit()">✕ Sair do modo admin</button>
</div>

<!-- MODAL: PIN Admin -->
<div class="admin-modal-overlay" id="admin-pin-overlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="admin-modal" style="padding:28px">
    <div style="font-size:18px;font-weight:700;margin-bottom:6px">🔐 Acesso Admin</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:20px">Digite o PIN para acessar workspaces de outros usuários.</div>
    <input id="admin-pin-input" type="password" class="input" placeholder="PIN"
      style="width:100%;padding:10px 14px;font-size:15px;letter-spacing:4px;margin-bottom:14px"
      onkeydown="if(event.key==='Enter')adminAuthSubmit()">
    <div id="admin-pin-err" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" style="flex:1" onclick="adminAuthSubmit()">Entrar</button>
      <button class="btn btn-ghost" onclick="document.getElementById('admin-pin-overlay').classList.remove('show')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL: Workspace selector -->
<div class="admin-modal-overlay" id="admin-ws-overlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="admin-modal">
    <div style="padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:16px;font-weight:700">👥 Workspaces</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Clique para visualizar como esse usuário</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="loadAdminWorkspaces()">🔄</button>
    </div>
    <div id="admin-ws-list" style="padding:8px 0">
      <div style="padding:28px;text-align:center;color:var(--text3)"><span class="spin"></span> Carregando...</div>
    </div>
  </div>
</div>
