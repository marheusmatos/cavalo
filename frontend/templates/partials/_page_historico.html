<div class="page" id="page-historico">
  <div class="section">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="loadLog()">🔄 Atualizar</button>
      <a id="log-dl-link" class="btn btn-ghost btn-sm">⬇️ Baixar CSV</a>
      <input class="input" id="log-q" style="max-width:200px;padding:7px 12px;font-size:13px"
             placeholder="Buscar..." oninput="filtLog()">
    </div>
    <!-- Filtros por status -->
    <div class="log-filters" id="log-filters">
      <div class="lf-chip on" data-filter="all" onclick="setLogFilter(this,'all')">Todos</div>
      <div class="lf-chip" data-filter="OK" onclick="setLogFilter(this,'OK')">✅ OK</div>
      <div class="lf-chip" data-filter="ERRO" onclick="setLogFilter(this,'ERRO')">❌ Erro</div>
      <div class="lf-chip" data-filter="PARCIAL" onclick="setLogFilter(this,'PARCIAL')">⚠️ Parcial</div>
      <div class="lf-chip" data-filter="reenvio" onclick="setLogFilter(this,'reenvio')">🔁 Reenvio</div>
      <div class="lf-chip" data-filter="teste" onclick="setLogFilter(this,'teste')">🧪 Teste</div>
    </div>
    <!-- Filtros por op -->
    <div class="log-filters" id="log-op-filters" style="margin-top:4px"></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Data</th><th>Operação</th><th>Arquivo</th>
          <th>Status</th><th>Modo</th><th>Detalhe</th><th>Ação</th>
        </tr></thead>
        <tbody id="log-tbody">
          <tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text3)">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="reenv-res" style="margin-top:12px"></div>
    <div id="log-footer" style="font-size:12px;color:var(--text3);margin-top:8px;text-align:right"></div>
  </div>
</div>
